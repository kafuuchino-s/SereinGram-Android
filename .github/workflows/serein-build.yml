name: Build SereinGram

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact source commit prepared for this release.
        type: string
        required: true
    outputs:
      artifact-name:
        description: Signed and verified APK artifact.
        value: ${{ jobs.apk.outputs.artifact-name }}

permissions:
  contents: read

concurrency:
  group: serein-build-${{ github.ref }}
  cancel-in-progress: false

env:
  NDK_VERSION: 27.2.12479018
  SEREIN_SIGNING_SHA1: ${{ vars.SEREIN_SIGNING_SHA1 }}

jobs:
  configuration:
    name: Check build configuration
    if: github.repository == 'kafuuchino-s/SereinGram-Android'
    runs-on: ubuntu-24.04
    steps:
      - name: Clone.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up JDK 21.
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up uv.
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Check credentials and the native signing certificate before compiling.
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
          TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: uv run --with httpx==0.28.1 python Tools/serein/ci/prepare_build.py check

  apk:
    name: Signed APKs
    outputs:
      artifact-name: SereinGram-${{ inputs.ref || github.sha }}
    needs: configuration
    runs-on: ubuntu-24.04
    env:
      TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
      TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
    steps:
      - name: Clone.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Restore the Firebase Android client.
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: python3 Tools/serein/ci/prepare_build.py firebase

      - name: Set up the Android SDK and NDK.
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: build-tools;36.0.0 platforms;android-36 ndk;${{ env.NDK_VERSION }} cmake;3.22.1

      - name: Build the APKs with the fixed signing key.
        id: build
        uses: ./.github/actions/build-apks
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          signing-sha1: ${{ env.SEREIN_SIGNING_SHA1 }}
          keystore-base64: ${{ secrets.KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.KEYSTORE_PASS }}
          key-alias: ${{ secrets.ALIAS_NAME }}
          key-password: ${{ secrets.ALIAS_PASS }}

      - name: Set up uv.
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Verify APK certificates against the keystore and native check.
        env:
          APK_DIR: ${{ steps.build.outputs.apk-dir }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
        run: uv run Tools/serein/ci/release.py verify --apk-dir "$APK_DIR"

      - name: Keep the signed APKs.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SereinGram-${{ inputs.ref || github.sha }}
          path: |
            ${{ steps.build.outputs.apk-dir }}/*.apk
            ${{ steps.build.outputs.apk-dir }}/output-metadata.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
