name: Build SereinGram

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: serein-build-${{ github.ref }}
  cancel-in-progress: false

env:
  NDK_VERSION: 27.2.12479018
  SEREIN_SIGNING_SHA1: ${{ vars.SEREIN_SIGNING_SHA1 }}

jobs:
  configuration:
    name: Check build configuration
    if: github.repository == 'kafuuchino-s/SereinGram-Android'
    runs-on: ubuntu-24.04
    steps:
      - name: Clone.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21.
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up uv.
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Check credentials and the native signing certificate before compiling.
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
          TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: uv run --with httpx==0.28.1 python Tools/serein/ci/prepare_build.py check

  native:
    name: Native build (${{ matrix.abi }})
    needs: configuration
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a]
    steps:
      - name: Clone.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Native library cache key.
        id: key
        uses: ./.github/actions/native-cache-key
        with:
          abi: ${{ matrix.abi }}
          ndk-version: ${{ env.NDK_VERSION }}
          signing-sha1: ${{ env.SEREIN_SIGNING_SHA1 }}

      - name: Native library cache.
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: TMessagesProj/src/main/libs
          key: ${{ steps.key.outputs.key }}

      - name: Restore the Firebase Android client.
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: python3 Tools/serein/ci/prepare_build.py firebase

      - name: Check out the native sources.
        if: steps.cache.outputs.cache-hit != 'true'
        run: git submodule update --init --depth 1

      - name: Set up JDK 21.
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle.
        if: steps.cache.outputs.cache-hit != 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up the Android SDK and NDK.
        if: steps.cache.outputs.cache-hit != 'true'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: build-tools;36.0.0 platforms;android-36 ndk;${{ env.NDK_VERSION }} cmake;3.22.1

      - name: Build the Telegram native library.
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          NATIVE_TARGET: ${{ matrix.abi }}
        run: |
          ./run init libs
          ./run libs native

  apk:
    name: Signed APKs
    needs: native
    runs-on: ubuntu-24.04
    env:
      TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
      TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
    steps:
      - name: Clone.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the libraries Gradle configures.
        run: git submodule update --init --depth 1 TMessagesProj/lib/jlatexmath TMessagesProj_Modules/media

      - name: Restore the Firebase Android client.
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: python3 Tools/serein/ci/prepare_build.py firebase

      - name: Set up the Android SDK and NDK.
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: build-tools;36.0.0 platforms;android-36 ndk;${{ env.NDK_VERSION }} cmake;3.22.1

      - name: Build the APKs with the fixed signing key.
        id: build
        uses: ./.github/actions/build-apks
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          signing-sha1: ${{ env.SEREIN_SIGNING_SHA1 }}
          keystore-base64: ${{ secrets.KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.KEYSTORE_PASS }}
          key-alias: ${{ secrets.ALIAS_NAME }}
          key-password: ${{ secrets.ALIAS_PASS }}

      - name: Set up uv.
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Verify APK certificates against the keystore and native check.
        env:
          APK_DIR: ${{ steps.build.outputs.apk-dir }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
        run: uv run Tools/serein/ci/release.py verify --apk-dir "$APK_DIR"

      - name: Keep the signed APKs.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SereinGram-${{ github.sha }}
          path: |
            ${{ steps.build.outputs.apk-dir }}/*.apk
            ${{ steps.build.outputs.apk-dir }}/output-metadata.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
